<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二阶段预告 · 野鸡动画编程课</title>
<script>var AppStore = window.AppStore || window.localStorage;</script>
<style>
  :root {
    --bg: #f1f5f9; --bg-card: #ffffff; --text: #0f172a;
    --text-soft: #475569; --text-faint: #94a3b8; --border: #e2e8f0;
    --bg-soft: #f8fafc;
  }
  html.dark {
    --bg: #0f172a; --bg-card: #1e293b; --text: #e2e8f0;
    --text-soft: #cbd5e1; --text-faint: #64748b; --border: #334155;
    --bg-soft: #172033;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 640px; width: 100%; text-align: center;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 36px;
    box-shadow: 0 12px 40px rgba(15,23,42,.10);
  }
  .emoji { font-size: 52px; }
  h1 { font-size: 26px; margin: 16px 0 20px; }
  p { color: var(--text-soft); font-size: 15px; line-height: 2; }
  .note {
    margin-top: 24px; padding: 16px 18px; text-align: left;
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 12px; font-size: 14px; line-height: 1.9; color: var(--text-soft);
  }
  .note strong { color: var(--text); }
  .btns { display: flex; gap: 14px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 30px; border-radius: 12px;
    font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer;
    border: 1px solid var(--border); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15,23,42,.15); }
  .btn-home { background: var(--bg); color: var(--text-soft); }
</style>
</head>
<body>

<div class="card">
  <div class="emoji">🚧</div>
  <h1>第二阶段正在路上</h1>
  <p>你已经完成了第一阶段的核心课程，接下来这一段还没有开放。</p>

  <div class="note">
    <strong>第二阶段会是什么样</strong><br>
    不再是一条固定路线，而是按方向自由选修的课程包。目前规划了四个方向：
    算法竞赛、趣味编程、AI辅助项目创作、AI提高办公效率。<br>
    具体内容会陆续补上，完成后会在这里开放。
  </div>

  <div class="btns">
    <a class="btn btn-home" href="index.html">返回主页</a>
  </div>
</div>

<script>
/* 主题：与教程其他页面保持一致 */
(function () {
  try {
    if (AppStore.getItem("coding-101-theme") === "dark" ||
        (!AppStore.getItem("coding-101-theme") && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
