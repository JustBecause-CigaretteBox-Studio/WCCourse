<style>
  :root {
    --bg: #f1f5f9; --bg-card: #ffffff; --text: #0f172a;
    --text-soft: #475569; --text-faint: #94a3b8; --border: #e2e8f0;
  }
  html.dark {
    --bg: #0f172a; --bg-card: #1e293b; --text: #e2e8f0;
    --text-soft: #cbd5e1; --text-faint: #64748b; --border: #334155;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 720px; width: 100%; text-align: center;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 44px 32px;
    box-shadow: 0 12px 40px rgba(15,23,42,.10);
  }
  h1 { font-size: 24px; line-height: 1.6; }
  h1 small { display: block; font-size: 14px; color: var(--text-faint); font-weight: 400; margin-top: 6px; }
  .mot { color: var(--text-soft); font-size: 15px; margin-top: 14px; }
  .codes { display: none; gap: 24px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .codes.show { display: flex; }
  .code { flex: 0 1 240px; }
  .code img {
    width: 100%; border-radius: 14px; border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(15,23,42,.10); display: block;
  }
  .code span { display: block; margin-top: 10px; font-size: 13.5px; color: var(--text-faint); }
  .agree {
    margin-top: 26px; padding: 12px 18px; border: 1px dashed var(--border); border-radius: 12px; display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--text-soft); cursor: pointer; user-select: none;
  }
  .agree input { width: 18px; height: 18px; accent-color: #f59e0b; cursor: pointer; }
  .thanks { display: none; margin-top: 16px; color: #059669; font-weight: 700; font-size: 15px; }
  html.dark .thanks { color: #6ee7b7; }
  .back { display: inline-block; margin-top: 26px; font-size: 14px; color: #0284c7; text-decoration: none; }
  .back:hover { text-decoration: underline; }
</style>
