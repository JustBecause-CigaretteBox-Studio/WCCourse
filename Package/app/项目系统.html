<script>
(function () {

  /* ── 1. 主题切换 ── */
  var THEME_KEY = "coding-101-theme";

  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    themeBtn.textContent = dark ? "☀️" : "🌙";
  }
  var savedTheme = read(THEME_KEY);
  var startDark = savedTheme !== null
    ? savedTheme === "dark"
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(startDark);
  themeBtn.addEventListener("click", function () {
    var dark = !document.documentElement.classList.contains("dark");
    applyTheme(dark);
    store(THEME_KEY, dark ? "dark" : "light");
  });

  /* ── 2. 项目数据 ──
     说明：
     · starterCode 只搭好框架，不给出核心实现。

  var PROJECTS = [
    {

        "在这个项目里，你要写一个小小的「出题自动机」：它先问你想做多少道题、数字范围是多少，然后随机生成加减乘除口算题，并给出答案。"
      ],
      requirements: [
        "询问用户想生成多少道题（例如 10 道）。",
        "让用户选择数字范围（例如 1~20）。",
        "随机生成两个数和一种运算符（+、-、×、÷）。",
        "保证减法结果不为负数；除法必须能整除（没有余数）。",
        "把生成的题目和答案整齐地输出到屏幕上。",
        "（可选挑战）把题目保存到文件，或让用户输入答案后判分。"
      ],
      hints: [
        {
          title: "提示 1：先搭好输入部分",
          body: `先读取「题目数量」和「最大数字」。<br><br><strong>Python 示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>n = int(input('要生成几道题？'))
max_num = int(input('数字最大到多少？'))</pre><strong>C++ 示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>int n, max_num;
cout &lt;&lt; "要生成几道题？";
cin &gt;&gt; n;
cout &lt;&lt; "数字最大到多少？";
cin &gt;&gt; max_num;</pre>`
        },
        {
          title: "提示 2：随机数怎么生成",
          body: `在循环里每次生成两个随机数。Python 用 <code>random.randint(1, max_num)</code>，C++ 用框架里已经给出的 <code>myRand() % max_num + 1</code>。<br><br><strong>Python 示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>import random
for i in range(1, n + 1):
    a = random.randint(1, max_num)
    b = random.randint(1, max_num)</pre><strong>C++ 示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>for (int i = 1; i &lt;= n; i++) {
    int a = myRand() % max_num + 1;
    int b = myRand() % max_num + 1;
}</pre>`
        },
        {
          title: "提示 3：让除法能整除",
          body: `不要直接随机生成两个数再相除。先随机生成「除数」和「商」，让「被除数 = 除数 × 商」。<br><br><strong>示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>if op == '/':

        },
        {
          title: "提示 4：让减法不为负",
          body: `生成两个数后比较大小，用大的减小的；或者只生成 <code>a</code>，再生成一个 1~a 的 <code>b</code>。<br><br><strong>示例：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto'>if op == '-':

        },
        {

          body: `下面是一份完整实现，供你对照思路。建议先自己尝试，再看答案。<br><br><strong>Python：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto;font-size:12px'>import random

n = int(input('要生成几道题？'))

ops = ['+', '-', '*', '/']

for i in range(1, n + 1):

# 如果要输出答案，可把 ans 保存到列表再打印</pre><strong>C++：</strong><pre style='background:var(--code-inline-bg);padding:8px;border-radius:6px;overflow:auto;font-size:12px'>#include &lt;iostream&gt;

// 自定义随机函数，避免 JSCPP 的 rand() 多次运行后状态异常

    }

}</pre>`

    box.innerHTML = html;

    var btn = $("#next-hint");

    editor.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        e.preventDefault();
        var start = this.selectionStart;
        var end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
      }
    });

    editor.addEventListener("input", function () {
      projectCode[key] = this.value;
      store("coding-101-project-code", JSON.stringify(projectCode));

  /* ── 5. 运行代码 ── */
  function setOutput(html, isError) {
    var out = $("#code-output");
    out.innerHTML = html;
    out.classList.toggle("error", !!isError);
  }

  function setStatus(text) { $("#status-info").textContent = text; }

  function runPython(code, inputText) {
    var output = [];
    var inputLines = inputText.replace(/\r/g, "").split("\n").filter(function (x) { return x !== ""; });
    var inputIndex = 0;

    function outf(text) { output.push(text); }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined)
        throw "File not found: '" + x + "'";
      return Sk.builtinFiles.files[x];
    }

    Sk.configure({
      output: outf,
      read: builtinRead,
      inputfun: function (args) {
        if (inputIndex < inputLines.length) return inputLines[inputIndex++];
        return "";
      },
      inputfunTakesPrompt: true,
      execLimit: 10000
    });

    return Sk.misceval.asyncToPromise(function () {
      return Sk.importMainWithBody("__main__", false, code);
    }).then(function () {
      return output.join("");
    }).catch(function (err) {
      throw err.toString ? err.toString() : String(err);
    });
  }

  function runCpp(code, inputText) {
    var output = [];
    var exitCode = JSCPP.run(code, inputText.replace(/\r/g, ""), {
      stdio: {
        write: function (s) { output.push(s); }
      }
    });
    return output.join("") + (output.length ? "" : "（程序已结束，无输出）");
  }

  function setupRun(p) {
    $("#run-code").addEventListener("click", function () {
      var code = $("#code-editor").value;
      var input = $("#code-input").value;
      var btn = this;
      btn.disabled = true;
      setOutput("<span class='empty-output'>运行中…</span>", false);
      setStatus("运行中…");

      var runner = currentLang === "python" ? runPython : runCpp;

      // 用 setTimeout 让 UI 先刷新
      setTimeout(function () {
        try {
          var result = runner(code, input);
          if (result && typeof result.then === "function") {
            result.then(function (text) {
              setOutput(escapeHtml(text) || "（程序已结束，无输出）", false);
              setStatus("运行完成");
            }).catch(function (err) {
              setOutput("运行出错：\n" + escapeHtml(String(err)), true);
              setStatus("运行出错");
            }).finally(function () { btn.disabled = false; });
          } else {
            setOutput(escapeHtml(result) || "（程序已结束，无输出）", false);
            setStatus("运行完成");
            btn.disabled = false;
          }
        } catch (err) {
          setOutput("运行出错：\n" + escapeHtml(String(err)), true);
          setStatus("运行出错");
          btn.disabled = false;
        }
      }, 50);
    });
  }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
