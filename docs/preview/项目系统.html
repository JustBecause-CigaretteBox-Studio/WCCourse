<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>项目系统 · 野鸡动画编程课</title><style> :root { --bg: #f1f5f9; --bg-card: #ffffff; --text: #0f172a; --text-soft: #475569; --text-faint: #94a3b8; --border: #e2e8f0; --bg-soft: #f8fafc; } html.dark { --bg: #0f172a; --bg-card: #1e293b; --text: #e2e8f0; --text-soft: #cbd5e1; --text-faint: #64748b; --border: #334155; --bg-soft: #172033; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; } .card { max-width: 480px; width: 100%; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 36px; box-shadow: 0 12px 40px rgba(15,23,42,.10); } .emoji { font-size: 52px; margin-bottom: 16px; } h1 { font-size: 24px; margin-bottom: 12px; } p { color: var(--text-soft); font-size: 15px; line-height: 1.8; } .back { display: inline-block; margin-top: 28px; font-size: 14px; color: #0284c7; text-decoration: none; } .back:hover { text-decoration: underline; } </style></head><body><div class="card"><div class="emoji">🚧</div><h1>暂时未开放！</h1><p>项目系统正在维护中，请稍后回来。</p><a class="back" href="index.html">← 返回主页</a></div><script> (function () { try { if (localStorage.getItem("coding-101-theme") === "dark" || (!localStorage.getItem("coding-101-theme") && matchMedia("(prefers-color-scheme: dark)").matches)) { document.documentElement.classList.add("dark"); } } catch (e) {} })(); </script></body></html>
