  .hint-btn {
    display: inline-flex; align-items: center; gap: 6px;

  applyTheme(startDark);

        { title: "提示 3：完整参考代码", body: `<strong>Python：</strong><pre>a, b = map(int, input().split())

      statement: `
        <h3>题目描述</h3>
        <p>已知：S<sub>n</sub> = 1 + 1/2 + 1/3 + … + 1/n。显然对于任意一个整数 k，当 n 足够大的时候，S<sub>n</sub> &gt; k。</p>
        <p>现给出一个整数 k，要求计算出一个最小的 n，使得 S<sub>n</sub> &gt; k。</p>
        <h3>输入格式</h3>

          renderHintsHtml(p, revealed);

      });
